# ── Configuración INICIAL (solo HTTP) ────────────────────────────────────────
# Sirve para arrancar el sistema y para que Let's Encrypt valide el dominio.
# Una vez obtenido el certificado, se sustituye por app-ssl.conf (ver guía).

server {
    listen 80;
    server_name prodiasv07.fis.usal.es;

    # Subidas de vídeo grandes
    client_max_body_size 200M;

    # Reto ACME de Let's Encrypt (validación del certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → API (FastAPI)
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
