# ── Configuración FINAL (HTTP→HTTPS + TLS) ───────────────────────────────────
# Usar SOLO después de haber obtenido el certificado con certbot.
# Instalación (en el servidor):
#   cp nginx/app-ssl.conf nginx/conf.d/app.conf
#   docker compose exec nginx nginx -s reload

# HTTP → redirige a HTTPS (salvo el reto ACME, que debe seguir en claro)
server {
    listen 80;
    server_name prodiasv07.fis.usal.es;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name prodiasv07.fis.usal.es;

    ssl_certificate     /etc/letsencrypt/live/prodiasv07.fis.usal.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prodiasv07.fis.usal.es/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 200M;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
